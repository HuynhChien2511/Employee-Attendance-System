spring.application.name=Employee-Attendance-System

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/employee_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=never
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Server Configuration
server.port=8080

# Public base URL for building password reset links in email
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Forgot password security settings
app.security.reset-token-expiry-minutes=${RESET_TOKEN_EXPIRY_MINUTES:15}
app.security.reset-password.mail-from=${RESET_MAIL_FROM:${MAIL_USERNAME:}}

# SMTP settings (configure for your provider in environment variables)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Configuration
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
