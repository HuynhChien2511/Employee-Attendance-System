<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAS - Reset Password</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layouts.css">
<link rel="stylesheet" href="/assets/css/themes/attendance-theme.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins','Trebuchet MS','Segoe UI',sans-serif;background:linear-gradient(135deg,#115e59 0%,#0ea5a4 50%,#f59e0b 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fffdf8;border-radius:16px;padding:34px 36px;width:380px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.24)}
  h1{font-size:22px;font-weight:700;color:#115e59;margin-bottom:8px;text-align:center}
  p{font-size:13px;color:#666;text-align:center;margin-bottom:20px}
  .form-group{margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:6px}
  input{width:100%;padding:10px 14px;border:2px solid #d8e2dc;border-radius:8px;font-size:14px;transition:.2s;background:#fff}
  input:focus{outline:none;border-color:#14b8a6}
  .btn{width:100%;padding:12px;background:linear-gradient(135deg,#115e59,#0ea5a4);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;margin-top:6px}
  .btn:hover{opacity:.9;transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .msg{border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px;display:none}
  .msg.error{background:#fdecea;color:#c62828;border:1px solid #ef9a9a}
  .msg.ok{background:#ecfeff;color:#0f766e;border:1px solid #a5f3fc}
  .back{display:block;text-align:center;margin-top:16px;color:#0f766e;font-size:13px;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p>Enter your new password below.</p>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" minlength="8" placeholder="At least 8 characters" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" minlength="8" placeholder="Retype your new password" required>
      </div>
      <button class="btn" id="submitBtn" type="submit">Reset Password</button>
    </form>

    <div id="msg" class="msg"></div>
    <a class="back" href="/login">Back to Login</a>
  </div>

<script>
const resetToken = new URLSearchParams(window.location.search).get('token') || '';

function showMsg(text, type){
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + (type === 'ok' ? 'ok' : 'error');
  msg.style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (!resetToken) {
    showMsg('Invalid reset link. Please open the link from your email again.', 'error');
    return;
  }
  if (newPassword.length < 8) {
    showMsg('Password must be at least 8 characters.', 'error');
    return;
  }
  if (newPassword !== confirmPassword) {
    showMsg('Passwords do not match.', 'error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token: resetToken, newPassword })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showMsg(data.error || 'Failed to reset password.', 'error');
      return;
    }
    showMsg('Password reset successful. Redirecting to login...', 'ok');
    setTimeout(() => window.location.href = '/login', 1500);
  } catch {
    showMsg('Server connection error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
});

if (!resetToken) {
  document.getElementById('submitBtn').disabled = true;
  showMsg('Invalid reset link. Please request a new password reset email.', 'error');
}
</script>
</body>
</html>
